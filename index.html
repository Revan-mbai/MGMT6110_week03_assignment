<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SG Bus Tracker</title>
    <meta name="description" content="Real-time bus arrival tracking and traffic incident monitoring for Singapore bus commuters." />
    <meta property="og:title" content="SG Bus Tracker" />
    <meta property="og:description" content="Real-time bus arrival tracking and traffic incident monitoring for Singapore bus commuters." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress cross-origin third-party script errors (e.g. Disqus embed, ad-blockers)
      window.addEventListener('error', function (event) {
        if (
          event.message === 'Script error.' ||
          (typeof event.filename === 'string' && event.filename.indexOf('disqus') !== -1)
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopPropagation) event.stopPropagation();
          return true;
        }
      }, true);
      window.onerror = function (message, source) {
        if (
          message === 'Script error.' ||
          (typeof source === 'string' && source.indexOf('disqus') !== -1)
        ) {
          return true;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
